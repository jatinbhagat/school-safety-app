# AWS Amplify Build Configuration for PWA (Next.js)
version: 1
applications:
  - appRoot: services/pwa
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for PWA..."
            - npm ci --legacy-peer-deps
        build:
          commands:
            - echo "Building Next.js PWA for production..."
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
